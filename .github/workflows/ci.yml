name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: main-construction_core-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client and PDF tools
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client poppler-utils fonts-dejavu-core

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 --skip-assets erpnext
          bench get-app --skip-assets construction_core $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app construction_core
          bench --site test_site migrate
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app construction_core
        env:
          TYPE: server

      - name: Record versions
        working-directory: /home/runner/frappe-bench
        run: bench version

      - name: Build portal
        working-directory: /home/runner/frappe-bench
        run: |
          bench build --app construction_core
          test -f apps/construction_core/construction_core/www/portal.html

      - name: Portal end-to-end (Playwright)
        working-directory: /home/runner/frappe-bench
        run: |
          E2E_PASSWORD="$(openssl rand -hex 16)"
          bench use test_site
          bench --site test_site execute construction_core.tests.e2e_setup.create_e2e_user \
            --kwargs "{'email': 'e2e-client@example.com', 'password': '$E2E_PASSWORD'}"
          bench --site test_site execute construction_core.tests.e2e_setup.create_temp_password_client > /tmp/temp_client.json
          E2E_TEMP_USER="$(python3 -c "import json,ast;d=ast.literal_eval(open('/tmp/temp_client.json').read().strip().splitlines()[-1]);print(d['username'])")"
          E2E_TEMP_PASSWORD="$(python3 -c "import json,ast;d=ast.literal_eval(open('/tmp/temp_client.json').read().strip().splitlines()[-1]);print(d['password'])")"
          export E2E_TEMP_USER E2E_TEMP_PASSWORD
          E2E_ENG_PASSWORD="$(openssl rand -hex 16)"
          bench --site test_site execute construction_core.tests.e2e_setup.create_engineer_project \
            --kwargs "{'email': 'e2e-eng@example.com', 'password': '$E2E_ENG_PASSWORD'}" > /tmp/eng.json
          E2E_ENG_PROJECT="$(python3 -c "import ast;print(ast.literal_eval(open('/tmp/eng.json').read().strip().splitlines()[-1])['project'])")"
          E2E_ENG_USER=e2e-eng@example.com
          ./env/bin/python apps/construction_core/e2e/make_photos.py /tmp/e2e-photos
          export E2E_ENG_USER E2E_ENG_PASSWORD E2E_ENG_PROJECT
          export E2E_PHOTOS_DIR=/tmp/e2e-photos
          E2E_CHAT_CLIENT_PASSWORD="$(openssl rand -hex 16)"
          bench --site test_site execute construction_core.tests.e2e_setup.add_chat_client \
            --kwargs "{'project': '$E2E_ENG_PROJECT', 'email': 'e2e-chat-client@example.com', 'password': '$E2E_CHAT_CLIENT_PASSWORD'}"
          export E2E_CHAT_CLIENT=e2e-chat-client@example.com E2E_CHAT_CLIENT_PASSWORD
          mkdir -p /tmp/e2e-shots
          bench --site test_site execute construction_core.setup.demo.install
          export E2E_ADMIN_PASSWORD=admin
          bench --site test_site execute construction_core.tests.e2e_setup.make_invoice_pdf \
            --kwargs "{'project': '$E2E_ENG_PROJECT', 'path': '/tmp/e2e-shots/invoice.pdf'}"
          pdftoppm -png -r 110 -f 1 -l 1 /tmp/e2e-shots/invoice.pdf /tmp/e2e-shots/20-invoice-pdf
          export E2E_SHOTS_DIR=/tmp/e2e-shots
          (bench serve --port 8000 > /tmp/serve.log 2>&1 &)
          for i in $(seq 1 45); do curl -sf http://localhost:8000/api/method/ping && break; sleep 2; done
          cd apps/construction_core/e2e
          yarn install --non-interactive
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8000 E2E_USER=e2e-client@example.com E2E_PASSWORD="$E2E_PASSWORD" \
            E2E_FULL_NAME="عميل التجربة" yarn test

      - name: Server log and Playwright report (on failure)
        if: failure()
        run: |
          tail -n 80 /tmp/serve.log || true
          find /home/runner/frappe-bench/apps/construction_core/e2e/test-results -name "*.md" -exec cat {} \; || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/e2e-shots
          if-no-files-found: ignore

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Payments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6B57}a:hover{color:#14503F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #17201D; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 8px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">الدفعات</h1>
  </header>

  <section style="margin: 4px 16px 12px; background: #FFFFFF; border-radius: 16px; padding: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6661">قيمة العقد</span><span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">566,000</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6661">اتدفع</span><span style="font-size: 16px; font-weight: 700; color: #14503F; font-variant-numeric: tabular-nums">255,000</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6661">متبقي</span><span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">311,000</span></div>
    <span style="grid-column: span 3; font-size: 12px; color: #5B6661">المبالغ بالجنيه المصري · شاملة أمر التغيير رقم 3</span>
  </section>

  <main style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <article style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border: 2px solid {{r.ring}}">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600">{{r.label}}</span>
            <span style="font-size: 12px; color: #5B6661">{{r.when}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
            <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.amount}}</span>
            <span style="font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: {{r.pillBg}}; color: {{r.pillFg}}">{{r.status}}</span>
          </div>
        </div>
        <sc-if value="{{r.due}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <a href="#" style="min-height: 44px; border-radius: 10px; background: #1D6B57; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">ادفع دلوقتي</a>
            <a href="#" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9CFC9; color: #17201D; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">ارفع إيصال تحويل</a>
          </div>
        </sc-if>
        <sc-if value="{{r.invoice}}" hint-placeholder-val="{{false}}">
          <a href="#" style="font-size: 13px; font-weight: 600">الفاتورة PDF</a>
        </sc-if>
      </article>
    </sc-for>
  </main>

  <nav aria-label="القائمة" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E5E0; padding: 6px 4px 18px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; text-decoration: none; color: {{t.color}}; font-weight: {{t.weight}}">
        <span aria-hidden="true" style="width: 22px; height: 4px; border-radius: 2px; background: {{t.bar}}"></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      paid: ['اتدفعت', '#E3F0EB', '#14503F'],
      due: ['مستحقة', '#FBEFDF', '#8A4A0C'],
      inv: ['اتعملت فاتورة', '#E4ECF8', '#1F4687'],
      up: ['جاية', '#EEF0EC', '#4A5550']
    };
    const r = (label, when, amount, k, invoice) => ({ label, when, amount, status: S[k][0], pillBg: S[k][1], pillFg: S[k][2], due: k === 'due', invoice, ring: k === 'due' ? '#E9B872' : 'transparent' });
    const tab = (label, href, on) => ({ label, href, color: on ? '#1D6B57' : '#5B6661', weight: on ? 700 : 500, bar: on ? '#1D6B57' : 'transparent' });
    return {
      rows: [
        r('دفعة التعاقد', 'اتدفعت 1 سبتمبر', '170,000', 'paid', true),
        r('بعد التأسيس', 'اتدفعت 12 أكتوبر', '85,000', 'paid', true),
        r('أمر تغيير رقم 3', 'مستحقة من 16 نوفمبر', '6,000', 'due', true),
        r('بعد المحارة', 'عند انتهاء المحارة · 25 نوفمبر تقريباً', '85,000', 'up', false),
        r('بعد الأرضيات', 'يناير 2027', '110,000', 'up', false),
        r('عند التسليم', 'مارس 2027', '110,000', 'up', false)
      ],
      tabs: [
        tab('الرئيسية', 'Main.dc.html', false),
        tab('المراحل', 'ClientTimeline.dc.html', false),
        tab('الصور', 'ClientGallery.dc.html', false),
        tab('الدفعات', 'ClientPayments.dc.html', true),
        tab('الشات', 'ClientChat.dc.html', false)
      ]
    };
  }
}
</script>
</body>
</html>

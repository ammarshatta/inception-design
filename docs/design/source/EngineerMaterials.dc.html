<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Site materials</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6B57}a:hover{color:#14503F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #17201D; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 8px">
    <a href="EngineerProjects.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E5E0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 19px; font-weight: 700">الخامات</h1>
      <span style="font-size: 12px; color: #5B6661">شقة التجمع الخامس</span>
    </div>
    <button onClick="{{open}}" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #1D6B57; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">+ طلب</button>
  </header>
  <div style="margin: 4px 16px 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{sum}}" as="s" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column">
        <span style="font-size: 11px; color: #5B6661">{{s.k}}</span>
        <span style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">{{s.v}}</span>
      </div>
    </sc-for>
  </div>
  <main style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{rows}}" as="m" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-size: 14px; font-weight: 600">{{m.name}}</span>
          <span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: {{m.pillBg}}; color: {{m.pillFg}}; flex-shrink: 0">{{m.status}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B6661"><span>{{m.qty}} · {{m.stage}}</span><span>{{m.used}}</span></div>
      </div>
    </sc-for>
  </main>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: #17201D66; display: flex; flex-direction: column; justify-content: flex-end">
      <section role="dialog" aria-label="طلب خامة" style="background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 8px">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C9CFC9"></span>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">طلب خامة</h2>
          <button onClick="{{close}}" aria-label="إغلاق" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #F4F5F2; font-family: inherit; font-size: 18px; color: #17201D">×</button>
        </div>
        <label for="mi" style="font-size: 12px; font-weight: 600">الصنف</label>
        <select id="mi"  style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D"><option>رمل مونة</option><option>أسمنت</option></select>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="mq" style="font-size: 12px; font-weight: 600">الكمية</label>
            <input id="mq" inputmode="decimal" value="3" style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="mu" style="font-size: 12px; font-weight: 600">الوحدة</label>
            <select id="mu"  style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D"><option>م³</option><option>شيكارة</option></select>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="md" style="font-size: 12px; font-weight: 600">مطلوب قبل</label>
            <input id="md" value="18 نوفمبر" style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="ms" style="font-size: 12px; font-weight: 600">المرحلة</label>
            <select id="ms"  style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D"><option>محارة</option></select>
          </div>
        </div>
        <label for="mn" style="font-size: 12px; font-weight: 600">ملاحظة</label>
        <input id="mn" placeholder="مثلاً: من نفس المورد" style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D">
        <span style="font-size: 11px; color: #5B6661">الطلب بيروح للمكتب يوافق ويختار المورد. لما الخامة توصل، سجّل الاستلام بصورة الفاتورة.</span>
        <button onClick="{{close}}" style="margin-top: 4px; min-height: 50px; border-radius: 14px; border: 0; background: #1D6B57; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">ابعت الطلب للمكتب</button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sheet: true, pick: 0 }; }
  renderVals() {
    const chips = (names) => names.map((label, i) => {
      const on = this.state.pick === i;
      return { label, on: on ? 'true' : 'false', bg: on ? '#1D6B57' : '#FFFFFF', fg: on ? '#FFFFFF' : '#17201D', border: on ? '#1D6B57' : '#E2E5E0', pick: () => this.setState({ pick: i }) };
    });
    const base = { sheet: this.state.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }) };
    const S = { done: ['خلصت', '#E3F0EB', '#14503F'], now: ['شغالة', '#FBEFDF', '#8A4A0C'], next: ['جاية', '#EEF0EC', '#4A5550'], req: ['مستني موافقة', '#FBEFDF', '#8A4A0C'], ok: ['اتوافق', '#E4ECF8', '#1F4687'], in: ['اتورّد', '#E3F0EB', '#14503F'] };
    const st = (k) => ({ status: S[k][0], pillBg: S[k][1], pillFg: S[k][2] });
    const m = (name, qty, stage, used, k) => Object.assign({ name, qty, stage, used }, st(k));
    return Object.assign(base, {
      sum: [{ k: 'مستني موافقة', v: '2' }, { k: 'في الطريق', v: '1' }, { k: 'اتورّد الشهر ده', v: '9' }],
      rows: [
        m('رمل مونة', '3 م³', 'محارة', 'مطلوب قبل 18 نوفمبر', 'req'),
        m('شبك تسليح محارة', '40 م²', 'محارة', 'مطلوب قبل 19 نوفمبر', 'req'),
        m('أسمنت بورتلاندي', '40 شيكارة', 'محارة', 'توريد بكرة', 'ok'),
        m('أسمنت بورتلاندي', '60 شيكارة', 'محارة', 'اتصرف 48 · فاضل 12', 'in'),
        m('رمل مونة', '6 م³', 'محارة', 'اتصرف 4.5 · فاضل 1.5', 'in'),
        m('سلك 3 مم', '12 لفة', 'تأسيس كهرباء', 'اتصرف كله', 'in')
      ]
    });
  }
}
</script>
</body>
</html>

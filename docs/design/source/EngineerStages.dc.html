<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Project stages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6B57}a:hover{color:#14503F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #17201D; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 8px">
    <a href="EngineerProjects.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E5E0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 19px; font-weight: 700">مراحل المشروع</h1>
      <span style="font-size: 12px; color: #5B6661">شقة التجمع الخامس · من قالب "شقة تشطيب كامل"</span>
    </div>
    <button onClick="{{open}}" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #1D6B57; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">+ مرحلة</button>
  </header>
  <div style="margin: 4px 16px 8px; background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; font-size: 13px">
    <span>8 مراحل · 16 أسبوع</span>
    <span style="font-weight: 700; color: #14503F">مجموع الأوزان 100%</span>
  </div>
  <main style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#AEB7B1" aria-label="اسحب للترتيب"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 600">{{r.name}}</span>
          <span style="font-size: 12px; color: #5B6661">{{r.dates}} · وزن {{r.w}}</span>
        </div>
        <span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: {{r.pillBg}}; color: {{r.pillFg}}; flex-shrink: 0">{{r.status}}</span>
      </div>
    </sc-for>
  </main>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: #17201D66; display: flex; flex-direction: column; justify-content: flex-end">
      <section role="dialog" aria-label="مرحلة جديدة" style="background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 8px">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C9CFC9"></span>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">مرحلة جديدة</h2>
          <button onClick="{{close}}" aria-label="إغلاق" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #F4F5F2; font-family: inherit; font-size: 18px; color: #17201D">×</button>
        </div>
        <span style="font-size: 12px; font-weight: 600">من مكتبة المراحل</span>
        <div role="radiogroup" aria-label="مكتبة المراحل" style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{lib}}" as="c" hint-placeholder-count="5">
            <button role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
          </sc-for>
        </div>
        <label for="sn" style="font-size: 12px; font-weight: 600">اسم المرحلة</label>
        <input id="sn" value="عزل حمامات" style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="sw" style="font-size: 12px; font-weight: 600">الوزن من المشروع %</label>
            <input id="sw" inputmode="numeric" value="4" style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="sd" style="font-size: 12px; font-weight: 600">المدة بالأيام</label>
            <input id="sd" inputmode="numeric" value="5" style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="ss" style="font-size: 12px; font-weight: 600">تبدأ بعد</label>
            <select id="ss"  style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D"><option>تأسيس سباكة</option></select>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="sc" style="font-size: 12px; font-weight: 600">الفريق</label>
            <select id="sc"  style="min-height: 42px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #17201D"><option>فريق سباكة 1</option></select>
          </div>
        </div>
        <label style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; font-size: 13px; font-weight: 600">العميل يشوف المرحلة دي<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1D6B57"></label>
        <span style="font-size: 11px; color: #5B6661">الأوزان هتتظبط تلقائياً عشان المجموع يفضل 100%.</span>
        <button onClick="{{close}}" style="margin-top: 4px; min-height: 50px; border-radius: 14px; border: 0; background: #1D6B57; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">أضف المرحلة</button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sheet: true, pick: 0 }; }
  renderVals() {
    const chips = (names) => names.map((label, i) => {
      const on = this.state.pick === i;
      return { label, on: on ? 'true' : 'false', bg: on ? '#1D6B57' : '#FFFFFF', fg: on ? '#FFFFFF' : '#17201D', border: on ? '#1D6B57' : '#E2E5E0', pick: () => this.setState({ pick: i }) };
    });
    const base = { sheet: this.state.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }) };
    const S = { done: ['خلصت', '#E3F0EB', '#14503F'], now: ['شغالة', '#FBEFDF', '#8A4A0C'], next: ['جاية', '#EEF0EC', '#4A5550'], req: ['مستني موافقة', '#FBEFDF', '#8A4A0C'], ok: ['اتوافق', '#E4ECF8', '#1F4687'], in: ['اتورّد', '#E3F0EB', '#14503F'] };
    const st = (k) => ({ status: S[k][0], pillBg: S[k][1], pillFg: S[k][2] });
    const r = (name, dates, w, k) => Object.assign({ name, dates, w }, st(k));
    return Object.assign(base, {
      lib: chips(['عزل', 'جبس بورد', 'تكييف', 'ألوميتال', 'مخصصة']),
      rows: [
        r('تكسير ونقل مخلفات', '1–7 سبتمبر', '5%', 'done'), r('تأسيس سباكة', '8–20 سبتمبر', '10%', 'done'),
        r('تأسيس كهرباء', '21 سبتمبر – 14 نوفمبر', '12%', 'done'), r('محارة', '10–28 نوفمبر', '15%', 'now'),
        r('أرضيات وسيراميك', 'ديسمبر', '20%', 'next'), r('نجارة وألوميتال', 'يناير', '15%', 'next'),
        r('دهانات', 'فبراير', '15%', 'next'), r('تشطيب نهائي وتسليم', 'مارس', '8%', 'next')
      ]
    });
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Design catalog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6B57}a:hover{color:#14503F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #17201D; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 16px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E5E0">
    <span style="font-size: 17px; font-weight: 700">[اسم المكتب]</span>
    <a href="PublicDesign.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 10px; background: #1D6B57; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; text-decoration: none">اطلب تنفيذ</a>
  </header>

  <section style="padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; text-wrap: balance">تصميمات شقق جاهزة للتنفيذ</h1>
    <p style="margin: 0; font-size: 14px; color: #5B6661">اختار التصميم، وشوف المراحل والتكلفة التقريبية قبل ما تكلّمنا.</p>
  </section>

  <div style="padding: 8px 16px; display: flex; gap: 8px; overflow: hidden">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button style="flex-shrink: 0; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9CFC9; background: {{f.bg}}; font-family: inherit; font-size: 13px; font-weight: 600; color: #17201D; display: flex; align-items: center; gap: 4px">
        {{f.label}}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </sc-for>
  </div>
  <div style="padding: 4px 16px 10px; display: flex; justify-content: space-between; font-size: 12px; color: #5B6661">
    <span>24 تصميم</span>
    <span>الترتيب: الأحدث</span>
  </div>

  <main style="flex: 1; overflow: hidden; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{designs}}" as="d" hint-placeholder-count="3">
      <a href="PublicDesign.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #17201D">
        <div role="img" aria-label="{{d.title}}" style="height: 168px; border-radius: 14px; background: {{d.cover}}; position: relative">
          <span style="position: absolute; bottom: 10px; right: 10px; font-size: 12px; font-weight: 700; background: #FFFFFF; border-radius: 8px; padding: 2px 8px">{{d.style}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <span style="font-size: 16px; font-weight: 700">{{d.title}}</span>
          <span style="font-size: 13px; color: #5B6661; flex-shrink: 0">{{d.weeks}}</span>
        </div>
        <span style="font-size: 13px; color: #5B6661">{{d.specs}}</span>
        <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{d.cost}}</span>
      </a>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const PH = {"modern": "url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 300%27 preserveAspectRatio=%27xMidYMid slice%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23E8E1D6%27/%3E%3Crect y=%27210%27 width=%27400%27 height=%2790%27 fill=%27%23B89C7A%27/%3E%3Crect x=%27250%27 y=%2740%27 width=%27110%27 height=%27140%27 fill=%27%23EAF1F4%27 stroke=%27%23FFF%27 stroke-width=%276%27/%3E%3Cline x1=%27305%27 y1=%2740%27 x2=%27305%27 y2=%27180%27 stroke=%27%23FFF%27 stroke-width=%274%27/%3E%3Crect x=%2740%27 y=%27150%27 width=%27190%27 height=%2760%27 rx=%2710%27 fill=%27%236F7F78%27/%3E%3Crect x=%2750%27 y=%27125%27 width=%27170%27 height=%2740%27 rx=%2710%27 fill=%27%237F8F88%27/%3E%3Crect x=%2770%27 y=%27200%27 width=%2712%27 height=%2716%27 fill=%27%233A3F3C%27/%3E%3Crect x=%27190%27 y=%27200%27 width=%2712%27 height=%2716%27 fill=%27%233A3F3C%27/%3E%3Crect x=%2795%27 y=%27230%27 width=%27110%27 height=%2714%27 rx=%274%27 fill=%27%235A4634%27/%3E%3Ccircle cx=%27150%27 cy=%2760%27 r=%2716%27 fill=%27%23F4D9A6%27/%3E%3Cline x1=%27150%27 y1=%270%27 x2=%27150%27 y2=%2744%27 stroke=%27%233A3F3C%27 stroke-width=%272%27/%3E%3Crect x=%27300%27 y=%27190%27 width=%2750%27 height=%2730%27 fill=%27%232F5F4F%27/%3E%3Cpath d=%27M312 190 q13 -40 26 0%27 fill=%27%233E8A6E%27/%3E%3C/svg%3E') center/cover", "neo": "url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 300%27 preserveAspectRatio=%27xMidYMid slice%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23EFE8DD%27/%3E%3Crect y=%27215%27 width=%27400%27 height=%2785%27 fill=%27%23C9B8A0%27/%3E%3Cg fill=%27none%27 stroke=%27%23D7CFC2%27 stroke-width=%274%27%3E%3Crect x=%2730%27 y=%2740%27 width=%27100%27 height=%27150%27/%3E%3Crect x=%27150%27 y=%2740%27 width=%27100%27 height=%27150%27/%3E%3Crect x=%27270%27 y=%2740%27 width=%27100%27 height=%27150%27/%3E%3C/g%3E%3Crect y=%270%27 width=%27400%27 height=%2714%27 fill=%27%23E9E3D8%27/%3E%3Ccircle cx=%27200%27 cy=%2760%27 r=%2722%27 fill=%27%23F1D79A%27/%3E%3Cpath d=%27M178 60 h44 l-10 20 h-24z%27 fill=%27%23C9A35A%27/%3E%3Crect x=%27110%27 y=%27160%27 width=%27180%27 height=%2755%27 rx=%2714%27 fill=%27%238C6F5A%27/%3E%3Crect x=%27120%27 y=%27138%27 width=%27160%27 height=%2734%27 rx=%2712%27 fill=%27%23A3826A%27/%3E%3C/svg%3E') center/cover", "minimal": "url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 300%27 preserveAspectRatio=%27xMidYMid slice%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23F6F5F2%27/%3E%3Crect y=%27220%27 width=%27400%27 height=%2780%27 fill=%27%23D8D4CC%27/%3E%3Crect x=%2760%27 y=%2760%27 width=%27120%27 height=%2790%27 fill=%27%23F0EFEC%27 stroke=%27%23C9C6BF%27 stroke-width=%273%27/%3E%3Crect x=%27200%27 y=%27185%27 width=%27150%27 height=%2735%27 rx=%274%27 fill=%27%23C2B49C%27/%3E%3Crect x=%27210%27 y=%27160%27 width=%2740%27 height=%2725%27 fill=%27%234A5550%27/%3E%3Ccircle cx=%27300%27 cy=%27170%27 r=%2714%27 fill=%27%237FA08C%27/%3E%3C/svg%3E') center/cover"};
    return {
      filters: [
        { label: 'المساحة', bg: '#FFFFFF' },
        { label: 'الغرف', bg: '#FFFFFF' },
        { label: 'الستايل', bg: '#E3F0EB' },
        { label: 'السعر', bg: '#FFFFFF' }
      ],
      designs: [
        { title: 'مودرن هادي', style: 'مودرن', cover: PH.modern, specs: '160 – 190 م² · 3 غرف · 2 حمام', cost: 'من [السعر] لـ [السعر] ج.م', weeks: '16 أسبوع' },
        { title: 'نيوكلاسيك دافي', style: 'نيوكلاسيك', cover: PH.neo, specs: '200 – 240 م² · 4 غرف · 3 حمام', cost: 'من [السعر] لـ [السعر] ج.م', weeks: '20 أسبوع' },
        { title: 'مينيمال عملي', style: 'مينيمال', cover: PH.minimal, specs: '110 – 130 م² · 2 غرفة · 1 حمام', cost: 'من [السعر] لـ [السعر] ج.م', weeks: '12 أسبوع' }
      ]
    };
  }
}
</script>
</body>
</html>

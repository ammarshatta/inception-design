<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Design detail and request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6B57}a:hover{color:#14503F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #17201D; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div role="img" aria-label="صورة التصميم" style="height: 200px; flex-shrink: 0; background: {{cover}}; position: relative">
    <a href="PublicCatalog.dc.html" aria-label="رجوع" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
    <span style="position: absolute; bottom: 10px; left: 12px; font-size: 12px; font-weight: 700; background: #FFFFFF; border-radius: 8px; padding: 2px 8px">1 / 12 · المسقط الأفقي</span>
  </div>

  <main style="flex: 1; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 21px; font-weight: 700">مودرن هادي</h1>
      <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">التكلفة التقديرية من [السعر] لـ [السعر] ج.م</span>
      <span style="font-size: 12px; color: #5B6661">السعر النهائي بعد المعاينة وحصر الكميات.</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{specs}}" as="s" hint-placeholder-count="4">
        <div style="background: #F4F5F2; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column">
          <span style="font-size: 11px; color: #5B6661">{{s.k}}</span>
          <span style="font-size: 13px; font-weight: 700">{{s.v}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 700">مراحل التنفيذ · 16 أسبوع</span>
      <span style="font-size: 12px; color: #5B6661; line-height: 1.6">تأسيس سباكة وكهرباء ← محارة ← أرضيات وسيراميك ← نجارة وألوميتال ← دهانات ← تشطيب نهائي وتسليم</span>
    </div>

    <form style="background: #F4F5F2; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 700">اطلب معاينة وتنفيذ</span>
      <label for="nm" style="font-size: 12px; font-weight: 600">الاسم</label>
      <input id="nm" style="min-height: 40px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px">
      <label for="ph" style="font-size: 12px; font-weight: 600">الموبايل</label>
      <input id="ph" inputmode="tel" dir="ltr" placeholder="01x xxxx xxxx" style="min-height: 40px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; text-align: right">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="gov" style="font-size: 12px; font-weight: 600">المحافظة</label>
          <select id="gov" style="min-height: 40px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 8px; font-family: inherit; font-size: 14px"><option>القاهرة</option><option>الجيزة</option></select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="ar" style="font-size: 12px; font-weight: 600">مساحة الشقة م²</label>
          <input id="ar" inputmode="numeric" style="min-height: 40px; border-radius: 10px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px">
        </div>
      </div>
      <label style="display: flex; gap: 8px; align-items: flex-start; font-size: 11px; color: #5B6661; padding-top: 2px">
        <input type="checkbox" style="width: 18px; height: 18px; accent-color: #1D6B57; margin: 0">
        موافق إن المكتب يتواصل معايا بخصوص الطلب ده (سياسة الخصوصية)
      </label>
    </form>
  </main>

  <div style="padding: 10px 16px 22px">
    <button style="width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: #1D6B57; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">اطلب التنفيذ</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const PH = {"modern": "url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 300%27 preserveAspectRatio=%27xMidYMid slice%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23E8E1D6%27/%3E%3Crect y=%27210%27 width=%27400%27 height=%2790%27 fill=%27%23B89C7A%27/%3E%3Crect x=%27250%27 y=%2740%27 width=%27110%27 height=%27140%27 fill=%27%23EAF1F4%27 stroke=%27%23FFF%27 stroke-width=%276%27/%3E%3Cline x1=%27305%27 y1=%2740%27 x2=%27305%27 y2=%27180%27 stroke=%27%23FFF%27 stroke-width=%274%27/%3E%3Crect x=%2740%27 y=%27150%27 width=%27190%27 height=%2760%27 rx=%2710%27 fill=%27%236F7F78%27/%3E%3Crect x=%2750%27 y=%27125%27 width=%27170%27 height=%2740%27 rx=%2710%27 fill=%27%237F8F88%27/%3E%3Crect x=%2770%27 y=%27200%27 width=%2712%27 height=%2716%27 fill=%27%233A3F3C%27/%3E%3Crect x=%27190%27 y=%27200%27 width=%2712%27 height=%2716%27 fill=%27%233A3F3C%27/%3E%3Crect x=%2795%27 y=%27230%27 width=%27110%27 height=%2714%27 rx=%274%27 fill=%27%235A4634%27/%3E%3Ccircle cx=%27150%27 cy=%2760%27 r=%2716%27 fill=%27%23F4D9A6%27/%3E%3Cline x1=%27150%27 y1=%270%27 x2=%27150%27 y2=%2744%27 stroke=%27%233A3F3C%27 stroke-width=%272%27/%3E%3Crect x=%27300%27 y=%27190%27 width=%2750%27 height=%2730%27 fill=%27%232F5F4F%27/%3E%3Cpath d=%27M312 190 q13 -40 26 0%27 fill=%27%233E8A6E%27/%3E%3C/svg%3E') center/cover"};
    return {
      cover: PH.modern,
      specs: [
        { k: 'المساحة', v: '160–190 م²' },
        { k: 'الغرف', v: '3' },
        { k: 'الحمامات', v: '2' },
        { k: 'الستايل', v: 'مودرن' }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Engineer projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6B57}a:hover{color:#14503F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #17201D; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 8px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #5B6661">صباح الخير، م. كريم</span>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">مشاريعي</h1>
    </div>
    <button aria-label="مزامنة: عنصرين في الانتظار" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #E9B872; background: #FBEFDF; color: #8A4A0C; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A4A0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M3 21v-5h5"></path></svg>
      2 في الانتظار
    </button>
  </header>

  <section style="margin: 4px 16px 12px; background: #17201D; color: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; color: #C7D0CB; font-weight: 600">شغل النهارده</span>
    <span style="font-size: 15px; font-weight: 600">محارة غرف النوم · شقة التجمع الخامس</span>
    <span style="font-size: 13px; color: #C7D0CB">فريق محارة 1 · 6 عمال · من 8 ص</span>
    <a href="ForemanClockIn.dc.html" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 10px; background: #FFFFFF; color: #17201D; font-size: 14px; font-weight: 700; display: flex; align-items: center; text-decoration: none">سجّل حضور الفريق</a>
  </section>

  <nav aria-label="إدارة المشروع" style="margin: 0 16px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <a href="EngineerStages.dc.html" style="min-height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E5E0; color: #17201D; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">المراحل</a>
    <a href="EngineerWorkers.dc.html" style="min-height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E5E0; color: #17201D; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">العمال</a>
    <a href="EngineerMaterials.dc.html" style="min-height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E5E0; color: #17201D; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">الخامات</a>
  </nav>

  <main style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
      <a href="EngineerUpdate.dc.html" style="background: #FFFFFF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #17201D">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <span style="font-size: 16px; font-weight: 700">{{p.name}}</span>
          <span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">{{p.pct}}</span>
        </div>
        <div style="height: 8px; background: #E9ECE7; border-radius: 4px; overflow: hidden"><div style="height: 8px; border-radius: 4px; background: #1D6B57; width: {{p.pct}}"></div></div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B6661">
          <span>{{p.stage}}</span>
          <span>{{p.last}}</span>
        </div>
        <sc-if value="{{p.flag}}" hint-placeholder-val="{{false}}">
          <span style="align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #FDE8E6; color: #B42318">{{p.flagText}}</span>
        </sc-if>
      </a>
    </sc-for>
  </main>

  <div style="padding: 12px 16px 22px; background: #F4F5F2">
    <a href="EngineerUpdate.dc.html" style="min-height: 52px; border-radius: 14px; background: #1D6B57; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      تحديث جديد
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      projects: [
        { name: 'شقة التجمع الخامس', pct: '46%', stage: 'محارة', last: 'آخر تحديث: النهارده', flag: true, flagText: 'اختيار متأخر: سيراميك الريسبشن' },
        { name: 'فيلا الشيخ زايد', pct: '72%', stage: 'دهانات', last: 'آخر تحديث: امبارح', flag: false, flagText: '' },
        { name: 'شقة مدينة نصر', pct: '12%', stage: 'تأسيس سباكة', last: 'آخر تحديث: من 3 أيام', flag: true, flagText: 'مفيش تحديث من 3 أيام' }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Project chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6B57}a:hover{color:#14503F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #17201D; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 16px 10px; background: #FFFFFF; border-bottom: 1px solid #E2E5E0; display: flex; align-items: center; gap: 10px">
    <div aria-hidden="true" style="display: flex">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #1D6B57; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">ك</span>
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #E4ECF8; color: #1F4687; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-right: -10px">م</span>
    </div>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">شات المشروع</h1>
      <span style="font-size: 12px; color: #5B6661">م. كريم (المهندس) · أ. منى (المكتب) · بنرد من 9 ص لـ 6 م</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 10px 14px 6px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
    <span style="align-self: center; font-size: 11px; color: #5B6661; background: #E9ECE7; border-radius: 999px; padding: 2px 10px">النهارده</span>

    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="6">
      <div style="align-self: {{m.side}}; max-width: 82%; display: flex; flex-direction: column; gap: 3px">
        <sc-if value="{{m.showName}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 11px; font-weight: 700; color: {{m.nameColor}}">{{m.name}}</span>
        </sc-if>
        <div style="background: {{m.bg}}; color: {{m.fg}}; border-radius: 14px; padding: {{m.pad}}; display: flex; flex-direction: column; gap: 6px; border: 1px solid {{m.border}}">
          <sc-if value="{{m.hasPhotos}}" hint-placeholder-val="{{false}}">
            <a href="ClientGallery.dc.html" aria-label="افتح الصور" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; text-decoration: none">
              <sc-for list="{{m.photos}}" as="p" hint-placeholder-count="2">
                <span style="height: 92px; border-radius: 10px; background: {{p.img}}; position: relative">
                  <sc-if value="{{p.more}}" hint-placeholder-val="{{false}}">
                    <span style="position: absolute; inset: 0; border-radius: 10px; background: #17201D99; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.more}}</span>
                  </sc-if>
                </span>
              </sc-for>
            </a>
          </sc-if>
          <sc-if value="{{m.hasLink}}" hint-placeholder-val="{{false}}">
            <a href="{{m.linkHref}}" style="background: #FFFFFF; border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #17201D; border: 1px solid #E2E5E0">
              <span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">{{m.linkTitle}}</span><span style="font-size: 12px; color: #5B6661">{{m.linkSub}}</span></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
            </a>
          </sc-if>
          <span style="font-size: 14px; line-height: 1.55">{{m.text}}</span>
        </div>
        <span style="font-size: 10px; color: #5B6661; align-self: {{m.side}}">{{m.time}}</span>
      </div>
    </sc-for>
  </main>

  <div style="padding: 4px 14px 6px; display: flex; gap: 6px; overflow: hidden">
    <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
      <button onClick="{{q.send}}" style="flex-shrink: 0; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #C9CFC9; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #17201D">{{q.label}}</button>
    </sc-for>
  </div>

  <div style="padding: 6px 12px 8px; display: flex; gap: 8px; align-items: center">
    <button aria-label="إرفاق صورة أو ملف" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #E2E5E0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.3-8.3"></path></svg>
    </button>
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">رسالة</label>
    <input id="msg" placeholder="اكتب رسالة…" style="flex: 1; min-width: 0; min-height: 44px; border-radius: 22px; border: 1px solid #C9CFC9; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 14px; color: #17201D">
    <button aria-label="إرسال" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: #1D6B57; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4L3 11l7 2 2 7z"></path><path d="M20 4l-10 9"></path></svg>
    </button>
  </div>

  <nav aria-label="القائمة" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E5E0; padding: 6px 4px 18px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; text-decoration: none; color: {{t.color}}; font-weight: {{t.weight}}">
        <span aria-hidden="true" style="width: 22px; height: 4px; border-radius: 2px; background: {{t.bar}}"></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: [] }; }
  renderVals() {
    const PH = {"electric": "url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 300%27 preserveAspectRatio=%27xMidYMid slice%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23BDB8B0%27/%3E%3Crect y=%27235%27 width=%27400%27 height=%2765%27 fill=%27%238A857E%27/%3E%3Cg stroke=%27%23E07B2A%27 stroke-width=%276%27 fill=%27none%27%3E%3Cpath d=%27M40 0 V100 H140%27/%3E%3Cpath d=%27M200 0 V170%27/%3E%3Cpath d=%27M260 0 V60 H360 V140%27/%3E%3C/g%3E%3Cg fill=%27%235F5A54%27%3E%3Crect x=%27130%27 y=%2788%27 width=%2726%27 height=%2726%27/%3E%3Crect x=%27188%27 y=%27160%27 width=%2726%27 height=%2726%27/%3E%3Crect x=%27348%27 y=%27130%27 width=%2726%27 height=%2726%27/%3E%3C/g%3E%3C/svg%3E') center/cover", "plumb": "url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 300%27 preserveAspectRatio=%27xMidYMid slice%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23C4BFB7%27/%3E%3Crect y=%27170%27 width=%27400%27 height=%27130%27 fill=%27%239A958E%27/%3E%3Cg stroke=%27%232E6FB0%27 stroke-width=%2710%27 fill=%27none%27%3E%3Cpath d=%27M0 230 H180 V190%27/%3E%3C/g%3E%3Cg stroke=%27%23D9E2E8%27 stroke-width=%2714%27 fill=%27none%27%3E%3Cpath d=%27M220 300 V220 H400%27/%3E%3C/g%3E%3Crect x=%2760%27 y=%2760%27 width=%27120%27 height=%2790%27 fill=%27%23B3AEA6%27/%3E%3C/svg%3E') center/cover"};
    const who = {
      eng: { name: 'م. كريم · المهندس', nameColor: '#14503F' },
      office: { name: 'أ. منى · المكتب', nameColor: '#1F4687' }
    };
    const msg = (from, text, time, extra) => {
      const me = from === 'me';
      return Object.assign({
        text, time,
        side: me ? 'flex-end' : 'flex-start',
        showName: !me, name: me ? '' : who[from].name, nameColor: me ? '' : who[from].nameColor,
        bg: me ? '#1D6B57' : '#FFFFFF', fg: me ? '#FFFFFF' : '#17201D', border: me ? '#1D6B57' : '#E2E5E0',
        pad: '8px 12px', hasPhotos: false, photos: [], hasLink: false, linkHref: '', linkTitle: '', linkSub: ''
      }, extra || {});
    };
    const sent = this.state.sent.map(t => msg('me', t, 'دلوقتي'));
    const quick = ['تمام، شكراً', 'ممكن أزور الموقع الخميس؟', 'ابعتلي صور أكتر'].map(label => ({
      label, send: () => this.setState({ sent: this.state.sent.concat([label]) })
    }));
    const tab = (label, href, on) => ({ label, href, color: on ? '#1D6B57' : '#5B6661', weight: on ? 700 : 500, bar: on ? '#1D6B57' : 'transparent' });
    return {
      msgs: [
        msg('eng', 'خلصنا تأسيس كهرباء الريسبشن والاستشاري استلم. دي الصور.', '2:10 م', {
          pad: '6px', hasPhotos: true,
          photos: [{ img: PH.electric, more: '' }, { img: PH.plumb, more: '+4' }]
        }),
        msg('me', 'ممتاز 👌 هو مكان بريزة التلفزيون اتنقل زي ما اتفقنا؟', '2:24 م'),
        msg('eng', 'أيوه، اتنقلت 40 سم شمال واتعمل أمر تغيير بيها.', '2:31 م'),
        msg('office', 'أمر التغيير رقم 3 جاهز للتوقيع، وبعد التوقيع هتنزل الدفعة بتاعته.', '3:05 م', {
          hasLink: true, linkHref: 'ClientSign.dc.html', linkTitle: 'أمر تغيير رقم 3 · 6,000 ج.م', linkSub: 'مستني توقيعك'
        })
      ].concat(sent),
      quick,
      tabs: [
        tab('الرئيسية', 'Main.dc.html', false),
        tab('المراحل', 'ClientTimeline.dc.html', false),
        tab('الصور', 'ClientGallery.dc.html', false),
        tab('الدفعات', 'ClientPayments.dc.html', false),
        tab('الشات', 'ClientChat.dc.html', true)
      ]
    };
  }
}
</script>
</body>
</html>
